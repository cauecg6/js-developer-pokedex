<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>

    <!-- Normalize CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
        integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Font Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;500;700&display=swap" rel="stylesheet">

    <!-- Nosso CSS (caminhos relativos, para funcionar também no GitHub Pages) -->
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/pokedex.css">
    <link rel="stylesheet" href="assets/css/modal.css">
</head>

<body>
    <section class="content">
        <h1>Pokedex</h1>

        <form id="searchForm" class="toolbar-search">
            <input type="text" id="searchInput" placeholder="Buscar por nome ou número (ex: pikachu ou 25)">
            <button type="submit">Buscar</button>
        </form>

        <div class="toolbar-filter">
            <label for="typeFilter">Filtrar por tipo:</label>
            <select id="typeFilter">
                <option value="">Todos os tipos</option>
                <option value="normal">Normal</option>
                <option value="fire">Fogo</option>
                <option value="water">Água</option>
                <option value="electric">Elétrico</option>
                <option value="grass">Planta</option>
                <option value="ice">Gelo</option>
                <option value="fighting">Lutador</option>
                <option value="poison">Veneno</option>
                <option value="ground">Terra</option>
                <option value="flying">Voador</option>
                <option value="psychic">Psíquico</option>
                <option value="bug">Inseto</option>
                <option value="rock">Pedra</option>
                <option value="ghost">Fantasma</option>
                <option value="dragon">Dragão</option>
                <option value="dark">Sombrio</option>
                <option value="steel">Aço</option>
                <option value="fairy">Fada</option>
            </select>
        </div>

        <p id="loadingMessage" class="loading">Carregando pokémons...</p>
        <p id="errorMessage" class="error-message" hidden></p>

        <ol id="pokemonList" class="pokemons">
            <!-- ..... Pokemons here ..... -->
        </ol>

        <div class="pagination">
            <button id="loadMoreButton" type="button">
                Load More
            </button>
        </div>
    </section>

    <!-- Modal com os detalhes do pokémon selecionado -->
    <div id="pokemonModal" class="modal" hidden>
        <div class="modal-content">
            <button id="modalCloseButton" class="modal-close" type="button" aria-label="Fechar">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Nosso JS -->
    <script src="assets/js/pokemon-model.js"></script>
    <script src="assets/js/poke-api.js"></script>
    <script src="assets/js/modal.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
